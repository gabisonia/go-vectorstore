services:
  ollama:
    image: ollama/ollama:0.40.16
    # Reuse Docker's default bridge; no new address pool is needed.
    network_mode: bridge
    ports:
      - "127.0.0.1:${PILOT_OLLAMA_PORT:-11435}:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 1g

volumes:
  models:
