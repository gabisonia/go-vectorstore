name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with or without leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release version and target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$(bash .github/scripts/release.sh resolve "$RAW_VERSION")"
          bash .github/scripts/release.sh verify-source "$tag"
          bash .github/scripts/release.sh verify-tag "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: resolve
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: startsWith(needs.resolve.outputs.tag, 'v0.7.')
        with:
          go-version: stable
      - name: Verify published connector modules from a clean consumer
        if: startsWith(needs.resolve.outputs.tag, 'v0.7.')
        run: bash scripts/test-connector-modules.sh --published
      - name: Ensure tag points to the tested commit
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash .github/scripts/release.sh publish-tag "$RELEASE_TAG"
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" --generate-notes --verify-tag --target "$GITHUB_SHA")
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
