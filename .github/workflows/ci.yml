name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

# Only refreshed pull requests supersede a run. Independent pushes and release
# callers each keep their own verification, including runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and vet (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test with race detection
        run: go test -race -timeout=5m ./...
      - name: Test experimental connector modules and consumer resolution
        run: bash scripts/test-connector-modules.sh
      - name: Run bounded fuzz campaigns
        run: bash scripts/test-fuzz.sh 50000x
      - name: Retain failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failing-fuzz-corpus-${{ matrix.go }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
      - name: Check documentation links and executable quickstart
        run: python3 scripts/check-docs.py
      - name: Run the README SQLite quickstart against the published module
        run: python3 scripts/check-readme-quickstart.py
      - name: Run credential-free sample smoke tests
        run: bash scripts/test-samples.sh
      - name: Vet
        run: go vet ./...
      - name: Test release tooling
        run: bash .github/scripts/release_test.sh

  sqlite-vec-probe:
    name: SQLite vec probe (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, go: '1.26.x'}
          - {os: ubuntu-latest, go: stable}
          - {os: macos-latest, go: '1.26.x'}
          - {os: windows-latest, go: '1.26.x'}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify opt-in extension and unextended writer compatibility
        run: |
          go test -count=1 -v -tags=sqlitevecprobe -timeout=3m ./internal/sqlitevecprobe ./stores/sqlitevec ./samples/sqlite-workload
          go test -count=1 -v -tags=sqlitevecprobe -run 'TestNativeVector|TestFileURI|TestVectorProjectionCleanupUsesKeyIndex' -timeout=3m ./stores/sqlite
      - name: Vet probe
        run: go vet -tags=sqlitevecprobe ./internal/sqlitevecprobe ./stores/sqlitevec

  reference-catalog:
    name: Locked .NET catalog and native provider interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-reference-catalog.sh
      - run: bash scripts/test-postgres-parity.sh
      - run: bash scripts/test-redis-parity.sh

  standalone-dotnet-parity:
    name: Native ${{ matrix.provider }} and .NET interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        provider: [weaviate, chroma, elasticsearch, milvus, mongodb, couchbase, oracle, pinecone, documentdb, cosmos-nosql]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-${{ matrix.provider }}-parity.sh

  sqlserver-dotnet-parity:
    name: Native SQL Server 2025 and .NET interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-sqlserver-parity.sh

  qdrant-dotnet-parity:
    name: Native Qdrant and .NET interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-qdrant-parity.sh

  qdrant-probe:
    name: Qdrant 1.20.2 probe (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.2
        ports:
          - 6333:6333
        env:
          QDRANT__TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify real Qdrant compatibility and publication gates
        env:
          QDRANT_TEST_URL: http://localhost:6333
        run: go test -count=1 -race -v -tags=qdrantprobe -timeout=3m ./internal/qdrantprobe
      - name: Vet probe
        run: go vet -tags=qdrantprobe ./internal/qdrantprobe
      - name: Verify bounded Qdrant provider and shared conformance
        env:
          QDRANT_TEST_URL: http://localhost:6333
        run: |
          go test -count=1 -race -tags=integration -timeout=5m ./stores/qdrant
          go vet -tags=integration ./stores/qdrant
      - name: Verify process-crash recovery on an owned disposable server
        run: go test -count=1 -race -tags=integration -run TestIntegrationRestart -timeout=3m ./stores/qdrant

  integration-postgres:
    name: Postgres ${{ matrix.postgres }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
        postgres: ['16', '18']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run Postgres integration tests with race detection
        env:
          PGVECTOR_TEST_IMAGE: pgvector/pgvector:pg${{ matrix.postgres }}
        # Separate go invocations avoid concurrent Testcontainers reaper creation
        # across the two test binaries and give each its own session lifetime.
        run: |
          go test -count=1 -race -tags=integration -timeout=5m ./stores/postgres
          go test -count=1 -race -tags=integration -timeout=5m ./samples/recipes

      - name: Replay handbook search and reindex on pgvector
        if: matrix.postgres == '16' && matrix.go == 'stable'
        run: bash samples/handbook/replay.sh postgres

  integration-redis:
    name: Redis ${{ matrix.redis }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # Bound build/startup and sample execution as well as the Go test binaries.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
        redis: ['7.4', '8.2']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run Redis storage contracts and failure tests
        env:
          REDIS_TEST_ADDR: localhost:6379
          REDIS_REQUIRE_SEARCH: ${{ matrix.redis == '8.2' }}
          REDIS_REQUIRE_JSON: ${{ matrix.redis == '8.2' }}
        run: go test -count=1 -race -tags=integration -timeout=5m -skip 'TestIntegration(Native|JSONNative)' ./stores/redis
      - name: Run Redis native index contracts and failure tests
        env:
          REDIS_TEST_ADDR: localhost:6379
          REDIS_REQUIRE_SEARCH: ${{ matrix.redis == '8.2' }}
          REDIS_REQUIRE_JSON: ${{ matrix.redis == '8.2' }}
        run: go test -count=1 -race -tags=integration -timeout=10m -run 'TestIntegration(Native|JSONNative)' ./stores/redis
      - name: Verify recovery on an owned persistent Redis fixture
        env:
          REDIS_TEST_IMAGE: redis:${{ matrix.redis }}
          REDIS_TEST_RECOVERY: 'true'
          REDIS_REQUIRE_SEARCH: ${{ matrix.redis == '8.2' }}
          REDIS_REQUIRE_JSON: ${{ matrix.redis == '8.2' }}
        run: go test -count=1 -race -v -tags=integration -timeout=5m -run '^TestIntegrationRecovery' ./stores/redis
      - name: Run persistent sample twice
        run: |
          go run ./samples/redis-store
          go run ./samples/redis-store
          go run ./samples/redis-store -namespace redis_hash_demo -storage hash
          go run ./samples/redis-store -namespace redis_hash_demo -storage hash
      - name: Run native indexed samples twice
        if: matrix.redis == '8.2'
        run: |
          go run ./samples/redis-store -namespace redis_native_demo -native
          go run ./samples/redis-store -namespace redis_native_demo -native
          go run ./samples/redis-store -namespace redis_flat_demo -native -index flat
          go run ./samples/redis-store -namespace redis_flat_demo -native -index flat
          go run ./samples/redis-store -namespace redis_text_demo -native -fulltext
          go run ./samples/redis-store -namespace redis_text_demo -native -fulltext
      - name: Run RedisJSON sample and explicit conversion twice
        if: matrix.redis == '8.2'
        run: |
          go run ./samples/redis-store -namespace redis_json_demo -storage json
          go run ./samples/redis-store -namespace redis_json_demo -storage json
          go run ./samples/redis-store -namespace redis_hash_demo -upgrade-json
          go run ./samples/redis-store -namespace redis_hash_demo -upgrade-json
          go run ./samples/redis-store -namespace redis_json_hnsw_demo -storage json -native
          go run ./samples/redis-store -namespace redis_json_hnsw_demo -storage json -native
          go run ./samples/redis-store -namespace redis_json_flat_demo -storage json -native -index flat
          go run ./samples/redis-store -namespace redis_json_flat_demo -storage json -native -index flat
          go run ./samples/redis-store -namespace redis_json_text_demo -storage json -native -fulltext
          go run ./samples/redis-store -namespace redis_json_text_demo -storage json -native -fulltext

      - name: Run native hybrid samples twice
        if: matrix.redis == '8.2'
        run: |
          go run ./samples/redis-store -namespace redis_hybrid_demo -native -hybrid
          go run ./samples/redis-store -namespace redis_hybrid_demo -native -hybrid
          go run ./samples/redis-store -namespace redis_json_hybrid_demo -storage json -native -index flat -hybrid
          go run ./samples/redis-store -namespace redis_json_hybrid_demo -storage json -native -index flat -hybrid
          go run ./samples/redis-store -namespace redis_terms_demo -native -keyword-terms
          go run ./samples/redis-store -namespace redis_terms_demo -native -keyword-terms
          go run ./samples/redis-store -namespace redis_json_terms_demo -storage json -native -index flat -keyword-terms
          go run ./samples/redis-store -namespace redis_json_terms_demo -storage json -native -index flat -keyword-terms
          go run ./samples/redis-store -namespace redis_nostem_demo -native -no-stem
          go run ./samples/redis-store -namespace redis_nostem_demo -native -no-stem
          go run ./samples/redis-store -namespace redis_json_nostem_demo -storage json -native -index flat -no-stem
          go run ./samples/redis-store -namespace redis_json_nostem_demo -storage json -native -index flat -no-stem

  local-doc-agent:
    name: Local doc agent (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
    defaults:
      run:
        working-directory: samples/local-doc-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: samples/local-doc-agent/go.sum
      - name: Test real framework tools with HTTP stand-ins
        run: go test -race -timeout=2m ./...
      - name: Vet
        run: go vet ./...
      - name: Scan isolated demo dependencies
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...

  docs-retrieval-pilot:
    name: Docs retrieval pilot (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', stable]
    defaults:
      run:
        working-directory: samples/docs-retrieval-pilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: samples/docs-retrieval-pilot/go.sum
      - name: Test ingestion, metrics, load and SQLite restore with HTTP stand-ins
        run: go test -race -timeout=2m ./...
      - name: Vet
        run: go vet ./...
      - name: Scan published consumer dependencies
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...

  aspire:
    name: Aspire samples (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            samples/aspire-vector-search/api/go.sum
      - name: Install pinned Aspire CLI
        shell: bash
        run: |
          set -euo pipefail
          asset=aspire-cli-linux-x64-17.0.0.tar.gz
          release=https://github.com/microsoft/aspire/releases/download/v17.0.0
          cli_dir="$RUNNER_TEMP/aspire-cli"
          mkdir -p "$cli_dir"
          curl --fail --location --retry 3 "$release/$asset" -o "$cli_dir/$asset"
          curl --fail --location --retry 3 "$release/$asset.sha512" -o "$cli_dir/$asset.sha512"
          python3 - "$cli_dir/$asset" <<'PY'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          expected = pathlib.Path(str(archive) + ".sha512").read_text().split()[0].lower()
          actual = hashlib.sha512(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("Aspire CLI SHA-512 mismatch")
          PY
          tar -xzf "$cli_dir/$asset" -C "$cli_dir"
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Restore and verify isolated Go AppHosts and API
        run: bash scripts/verify-aspire.sh
      - name: Start and check Aspire development services
        run: |
          aspire start --apphost samples/aspire-services/apphost.go --non-interactive
          aspire wait postgres --apphost samples/aspire-services/apphost.go --timeout 120 --non-interactive
          aspire wait redis --apphost samples/aspire-services/apphost.go --timeout 120 --non-interactive
          aspire wait qdrant --apphost samples/aspire-services/apphost.go --timeout 120 --non-interactive
          go run ./samples/model-store -dsn 'postgres://postgres:postgres@localhost:54329/vectorstore_test?sslmode=disable'
          go run ./samples/typed-fields -dsn 'postgres://postgres:postgres@localhost:54329/vectorstore_test?sslmode=disable'
          go run ./samples/redis-store -addr localhost:63799
          go run ./samples/redis-store -addr localhost:63799 -namespace aspire_json -storage json -native
          go run ./samples/qdrant-store
          go run ./samples/qdrant-store
      - name: Stop owned Aspire resources
        if: always()
        run: aspire stop --apphost samples/aspire-services/apphost.go --force --non-interactive

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Scan production and integration dependencies
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test -tags=integration ./...
          for adapter in azuresearch pinecone; do
            (cd "connectors/$adapter" && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...)
          done

  storage-upgrade:
    name: Released storage upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: bash scripts/test-storage-upgrade.sh

  api-compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Compare against the reviewed published baseline
        run: bash scripts/check-api.sh

  documentation-site:
    uses: ./.github/workflows/pages-build.yml

  required:
    name: Required CI
    if: always()
    needs: [test, sqlite-vec-probe, qdrant-probe, reference-catalog, standalone-dotnet-parity, sqlserver-dotnet-parity, qdrant-dotnet-parity, integration-postgres, integration-redis, local-doc-agent, docs-retrieval-pilot, aspire, vulnerabilities, api-compatibility, storage-upgrade, documentation-site]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in jobs.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required verification did not succeed: {failed}")
          print("Every required verification job succeeded.")
          PY
