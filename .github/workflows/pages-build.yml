name: Build documentation
on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/pages/requirements.txt
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: inputs.upload
        with:
          path: site
